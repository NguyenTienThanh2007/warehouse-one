[project]
name = "warehouse-api"
version = "0.1.0"
description = "WAREHOUSE ONE backend API (FastAPI)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.1.3",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
# Data-platform services (outbox relay, consumers, bronze writer, reconciliation). Not needed by
# the API process; installed in the pipeline image and for development (uv sync --all-extras).
pipeline = [
  "confluent-kafka==2.15.1",
  "pyarrow==25.0.1",
  "duckdb==1.5.5",
]

[project.scripts]
warehouse-pipeline = "warehouse_pipeline.cli:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "httpx2==2.13.1",
  "jsonschema==4.26.0",
  "ruff==0.16.10",
  "mypy==2.4.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warehouse_api", "src/warehouse_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
  "integration: requires a running PostgreSQL (WAREHOUSE_DATABASE_URL)",
  "kafka: also requires a Kafka broker (WAREHOUSE_KAFKA_BOOTSTRAP_SERVERS)",
  "lake: also requires an S3-compatible object store (WAREHOUSE_S3_*)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"migrations/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["warehouse_api", "warehouse_pipeline"]
