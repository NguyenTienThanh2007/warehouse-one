name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  typescript:
    name: TypeScript · format, lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Includes contract drift (data/schemas) and golden-fixture determinism checks.
      - run: pnpm test
      - run: pnpm build
      - name: Simulation benchmark (informational, CI hardware)
        run: pnpm bench:sim -- --ticks 1000

  python:
    name: Python API · ruff, mypy, pytest, migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: warehouse_ci
          POSTGRES_DB: warehouse_one
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U warehouse -d warehouse_one"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      WAREHOUSE_ENV: test
      WAREHOUSE_DATABASE_URL: postgresql+psycopg://warehouse:warehouse_ci@localhost:5432/warehouse_one
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          enable-cache: true
      # --all-extras: the data-platform package (warehouse_pipeline) is linted, typed and tested too.
      - run: uv sync --locked --python 3.12 --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ruff check --config pyproject.toml ../../infra/airflow
      - run: uv run mypy
      - run: uv run pytest
      # PostgreSQL-backed tests; Kafka/S3 tests run in the data-platform job.
      - run: uv run pytest -m "integration and not kafka"

  e2e:
    name: Browser end-to-end (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: typescript
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @warehouse-one/web build
      - run: pnpm exec playwright install --with-deps chromium
      # The API is not started here, so the status panel is expected to report "offline".
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            test-results/e2e
          retention-days: 7

  data-platform:
    name: Data platform · Kafka, MinIO, Airflow, dbt, end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: python
    env:
      API_PORT: "8000"
      WAREHOUSE_DATABASE_URL: postgresql+psycopg://warehouse:warehouse_dev@localhost:5432/warehouse_one
      WAREHOUSE_KAFKA_BOOTSTRAP_SERVERS: localhost:9094
      WAREHOUSE_S3_ENDPOINT: localhost:9000
      # Local-development credentials of the Compose MinIO service (not secrets).
      WAREHOUSE_S3_ACCESS_KEY: warehouse
      WAREHOUSE_S3_SECRET_KEY: warehouse_dev_minio
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          enable-cache: true
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose --profile data config --quiet
      - name: Build images (API, pipeline, Airflow)
        run: docker compose --profile data build
      # 1. Kafka/S3 integration tests run before the pipeline services start: they truncate the
      #    pipeline tables and use their own topics, buckets and consumer instances.
      - name: Start PostgreSQL, Kafka and MinIO
        run: docker compose --profile data up -d --wait postgres kafka minio
      - name: Relay, consumer, bronze and reconciliation integration tests
        working-directory: apps/api
        run: |
          uv sync --locked --python 3.12 --all-extras
          uv run pytest -m kafka
      # 2. DAG validation inside the Airflow image.
      - name: Airflow DAG validation
        run: >-
          docker compose --profile data run --rm --no-deps --entrypoint python airflow
          /opt/airflow/dag_tests/check_dags.py
      # 3. The whole stack, healthy, then the end-to-end proof.
      - name: Start the full data-platform stack
        run: GIT_SHA=${GITHUB_SHA::7} docker compose --profile data up -d --wait --wait-timeout 600
      - name: End-to-end smoke test
        run: scripts/data-platform-smoke.sh
      # 4. The browser records a run to the API and the stored run replays identically.
      - name: Browser recording to the API
        run: |
          NEXT_PUBLIC_API_URL=http://localhost:8000 pnpm --filter @warehouse-one/web build
          pnpm exec playwright install --with-deps chromium
          RECORDING_API_URL=http://localhost:8000 pnpm test:e2e recording
      - if: failure()
        run: docker compose --profile data ps -a && docker compose --profile data logs --no-color --tail 300
      - if: always()
        run: docker compose --profile data down -v

  docker:
    name: Docker Compose stack
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker compose config --quiet
      - run: GIT_SHA=${GITHUB_SHA::7} docker compose up -d --build --wait
      - name: Verify health, readiness and version
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/health/ready
          curl -fsS http://localhost:8000/version | grep -q "${GITHUB_SHA::7}"
          test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = "0"
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
